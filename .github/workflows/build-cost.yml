name: macOS semantics and build experiments
on:
  pull_request:
    paths:
      - build.ss
      - build-modules.ss
      - justfile
      - t/harness/build.ss
      - t/harness/test.ss
      - t/qualification/ascent-source-import-test.ss
      - bindings/build-entry.ss
      - bindings/artifact.ss
      - t/harness/library-spec.ss
      - t/performance/ascent-scenario-performance-test.ss
      - t/qualification/scheme-artifact-test.ss
      - t/qualification/ascent-support-study-output.ss
      - t/qualification/ascent-steensgaard-test.ss
      - t/qualification/ascent-steensgaard-reference.ss
      - t/performance/ascent-steensgaard-performance-test.ss
      - workbench/src/ascent_workbench/supervision.py
      - workbench/tests/test_supervision.py
      - tools/ci/build-cost-control.py
      - workbench/src/ascent_workbench/preparation_*.py
      - packages/proofs/lean/ExecutionPolicy.lean
      - packages/proofs/lean/Preparation*.lean
      - packages/proofs/quint/Preparation*.qnt
      - t/qualification/fixtures/preparation/**
      - .github/workflows/build-cost.yml
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline for on-demand ABBA; omit to run full macOS semantics
        required: false
      candidate:
        description: Optional candidate commit for a historical work diagnosis
        default: ""
        required: false
      work_only:
        description: Instrument work instead of qualifying wall time
        type: boolean
        default: false
      semantic_preparation:
        description: Measure source-Suite preparation with the same ABBA controls
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build-cost:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline != '' }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install released SDK prerequisites
        run: |
          brew update
          brew install gcc just openssl@3 zlib sqlite coreutils pkg-config
          command -v gcc-16
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install unchanged immutable SDK
        env:
          GERBIL_RELEASE_ARCHIVE_CACHE: ${{ runner.temp }}/archives
        run: bash tools/ci/install-gerbil-v19-release.sh "$RUNNER_TEMP/sdk"
      - name: Prepare one declared dependency seed
        run: |
          echo "GERBIL_BUILD_CORES=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"
          export GERBIL_BUILD_CORES="$(sysctl -n hw.logicalcpu)"
          mkdir -p "$HOME/.gerbil/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          gerbil deps --install
          test ! -e .gerbil/lib/gerbil-ascent
      - name: On-demand ABBA cold build and test preparation
        env:
          BASELINE: ${{ inputs.baseline }}
          CANDIDATE: ${{ inputs.candidate || github.event.pull_request.head.sha || github.sha }}
          WORK_ONLY: ${{ inputs.work_only || false }}
          SEMANTIC_PREPARATION: ${{ inputs.semantic_preparation || false }}
          GERBIL_BUILD_CORES: "3"
        run: |
          work_args=()
          if [[ "$WORK_ONLY" == "true" ]]; then work_args+=(--work-only); fi
          if [[ "$SEMANTIC_PREPARATION" == "true" ]]; then work_args+=(--semantic-preparation); fi
          python3 tools/ci/build-cost-control.py --baseline "$BASELINE" --candidate "$CANDIDATE" --output "$RUNNER_TEMP/build-cost" "${work_args[@]}"
      - name: Preserve every control and admission record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-build-cost-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-cost
          include-hidden-files: true

  macos-semantics:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.baseline == '') }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      GERBIL_BUILD_CORES: "3"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install released SDK prerequisites
        run: |
          brew update
          brew install gcc just openssl@3 zlib sqlite coreutils pkg-config
          command -v gcc-16
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install unchanged immutable SDK
        env:
          GERBIL_RELEASE_ARCHIVE_CACHE: ${{ runner.temp }}/archives
        run: bash tools/ci/install-gerbil-v19-release.sh "$RUNNER_TEMP/sdk"
      - name: Bind compiler inputs before restoring compiled preparation
        id: preparation
        run: |
          fingerprint="$(sha256sum "$GERBIL_HOME/bin/gxi" "$GERBIL_HOME/bin/gsc" "$GERBIL_HOME/include/gambit.h" "$(command -v gcc-16)" "$(gcc-16 -print-prog-name=cc1)" "$(xcrun --find ld)" "$GERBIL_PREFIX/gerbil-build-receipt.json" | sha256sum | cut -d ' ' -f 1)"
          printf 'toolchain=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
          git diff --exit-code HEAD -- '*.ss' bindings/c gerbil.pkg justfile ':(exclude)manifest.ss'
          source_inputs="$(git ls-files -s -- '*.ss' bindings/c gerbil.pkg justfile .github/workflows/build-cost.yml tools/ci/build-cost-control.py ':(exclude)manifest.ss' | sha256sum | cut -d ' ' -f 1)"
          printf 'source_inputs=%s\n' "$source_inputs" >> "$GITHUB_OUTPUT"
          echo 'source_bytes=${{ hashFiles('**/*.ss', 'bindings/c/**', '!manifest.ss', '!.gerbil/**', '!.ci/**', '!.cache/**', 'justfile', 'gerbil.pkg', '.github/workflows/build-cost.yml', 'tools/ci/build-cost-control.py') }}' >> "$GITHUB_OUTPUT"
          {
            echo 'cache_sources<<ASCENT_CACHE_SOURCE_PATHS'
            git ls-files -- '*.ss' bindings/c ':(exclude)manifest.ss'
            echo 'ASCENT_CACHE_SOURCE_PATHS'
          } >> "$GITHUB_OUTPUT"
      - name: Restore content-bound compiled preparation
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.preparation.outputs.cache_sources }}
            .gerbil
            .cache/ascent/compiled-library
          key: macos-preparation-v1-${{ runner.os }}-${{ runner.arch }}-3-${{ steps.preparation.outputs.toolchain }}-${{ steps.preparation.outputs.source_inputs }}-${{ steps.preparation.outputs.source_bytes }}
      - name: Admit restored compiler inputs
        env:
          EXPECTED_SOURCE_BYTES: ${{ steps.preparation.outputs.source_bytes }}
          RESTORED_SOURCE_BYTES: ${{ hashFiles('**/*.ss', 'bindings/c/**', '!manifest.ss', '!.gerbil/**', '!.ci/**', '!.cache/**', 'justfile', 'gerbil.pkg', '.github/workflows/build-cost.yml', 'tools/ci/build-cost-control.py') }}
        run: |
          test "$EXPECTED_SOURCE_BYTES" = "$RESTORED_SOURCE_BYTES"
          git diff --exit-code HEAD -- '*.ss' bindings/c gerbil.pkg justfile ':(exclude)manifest.ss'
      - name: Build current Scheme package and test support
        run: |
          mkdir -p "$HOME/.gerbil/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          gerbil deps --install
          just check-policy
      - name: Verify supported SDK compiler profile and allocation counters
        run: PYTHONPATH=workbench/src python3 -m unittest discover -s workbench/tests -p test_compiler_cost.py -v
      - name: Qualify complete source semantics with three workers
        run: python3 tools/ci/build-cost-control.py --semantics-only --output "$RUNNER_TEMP/macos-semantics"
      - name: Preserve semantic diagnostics and every batch log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-semantics-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-semantics
          include-hidden-files: true
