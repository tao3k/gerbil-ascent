[package]
name = "ascent-scheme"
version.workspace = true
edition.workspace = true
license.workspace = true
links = "ascent_scheme_program"

[dependencies]
gerbil-scheme.workspace = true
gerbil-scheme-sys.workspace = true
gerbil-scheme-python = { workspace = true, optional = true }
gerbil-ascent = { workspace = true, features = ["process-runtime"] }
libc = "=0.2.186"
bincode.workspace = true
serde.workspace = true
tempfile = "=3.27.0"
num-bigint.workspace = true

[features]
default = ["rayon"]
rayon = ["gerbil-ascent/rayon"]
instances = ["gerbil-scheme/isolated-instances", "ascent-build/instances", "dep:gerbil-scheme-python"]

[build-dependencies]
ascent-build = { path = "../ascent-build" }

[dev-dependencies]
num-rational.workspace = true
asp-rust.workspace = true
gerbil-scheme-aot-build.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[test]]
name = "archive_build"
path = "tests/integration/archive.rs"

[[bench]]
name = "hybrid_benchmark"
harness = false
required-features = ["rayon"]

[[test]]
name = "process_runtime"
path = "tests/integration/process_runtime.rs"

[[bench]]
name = "process_throughput"
harness = false
required-features = ["rayon"]

[[test]]
name = "row_materialization"
path = "tests/integration/row_materialization.rs"

[[bench]]
name = "provenance_load"
harness = false
required-features = ["rayon"]

[[test]]
name = "instance_semantics"
path = "tests/integration/instance_semantics.rs"
required-features = ["instances"]

[[test]]
name = "instance_control"
path = "tests/integration/instance_control.rs"
required-features = ["instances"]

[[test]]
name = "instance_resources"
path = "tests/integration/instance_resources.rs"
required-features = ["instances"]
