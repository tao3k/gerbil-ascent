[workspace]
members = ["ascent-build", "ascent", "ascent-python", "ascent-scheme", "ascent-c-abi"]
exclude = ["ascent-oracle"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 AND LGPL-2.1-or-later"

[workspace.dependencies]
gerbil-scheme = { git = "https://github.com/tao3k/gerbil-scheme-rust", rev = "6fb831e4528ab21d15c27f5e6723e35be2b90929", features = ["external-program"] }
gerbil-scheme-sys = { git = "https://github.com/tao3k/gerbil-scheme-rust", rev = "6fb831e4528ab21d15c27f5e6723e35be2b90929", features = ["external-program"] }
# The runtime branch retired this build-time compiler; keep its source pinned.
gerbil-scheme-rust-ir = { git = "https://github.com/tao3k/gerbil-scheme-rust", rev = "7ebc26dac9e32f982f9ab1455b664b01f2f6e007" }
gerbil-scheme-aot-build = { git = "https://github.com/tao3k/gerbil-scheme-rust", rev = "6fb831e4528ab21d15c27f5e6723e35be2b90929" }
gerbil-scheme-python = { git = "https://github.com/tao3k/gerbil-scheme-rust", rev = "6fb831e4528ab21d15c27f5e6723e35be2b90929", default-features = false }
asp-rust = { git = "https://github.com/tao3k/asp-rust", rev = "2419414ee5379bad89506496e3eaab928df68daf", version = "0.1.2", default-features = false }
gerbil-ascent = { path = "ascent", default-features = false }
ascent = "=0.8.1"
rayon = "=1.12.0"
tokio = { version = "=1.53.2", features = ["sync"] }
smallvec = "=1.16.2"
num-rational = "=0.4.2"
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
sha2 = "=0.10.9"
bincode = "=1.3.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
pyo3 = { version = "=0.27.2", features = ["abi3-py310", "num-bigint"] }

[profile.dev]
opt-level = 2
debug = 2
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
overflow-checks = true

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# Keep policy/build tools optimized too; their first-build CPU work is not a
# stalled compiler and must not be judged using a runtime wall-clock budget.
[profile.dev.package.gerbil-scheme-rust-project-harness]
opt-level = 3

[profile.release.package.gerbil-scheme-rust-project-harness]
opt-level = 3

[profile.dev.package.asp-rust]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
