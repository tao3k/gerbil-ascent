[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascent-engine"
version = "1"
description = "Public Python bindings for the ASCENT Scheme Library"
requires-python = ">=3.10"
dependencies = ["cffi>=1.16,<3"]

[project.optional-dependencies]
native-build = ["setuptools>=68"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ascent_engine*"]
