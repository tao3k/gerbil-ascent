[package]
name = "ascent-scheme"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gerbil-scheme.workspace = true
gerbil-scheme-sys.workspace = true
gerbil-ascent.workspace = true
num-bigint.workspace = true
tokio.workspace = true

[features]
default = ["rayon"]
rayon = ["gerbil-ascent/rayon"]

[build-dependencies]
gerbil-scheme-aot-build.workspace = true

[dev-dependencies]
num-rational.workspace = true
asp-rust.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[bench]]
name = "hybrid_benchmark"
harness = false
required-features = ["rayon"]
