[package]
name = "ascent-scheme"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gerbil-scheme.workspace = true
gerbil-scheme-sys.workspace = true
gerbil-ascent = { workspace = true, features = ["process-runtime"] }
libc = "=0.2.190"
bincode.workspace = true
serde.workspace = true
tempfile = "=3.27.0"
num-bigint.workspace = true

[features]
default = ["rayon"]
rayon = ["gerbil-ascent/rayon"]

[build-dependencies]
ascent-build = { path = "../ascent-build" }

[dev-dependencies]
num-rational.workspace = true
asp-rust.workspace = true
gerbil-scheme-aot-build.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[test]]
name = "archive_build"
path = "tests/integration/archive.rs"

[[bench]]
name = "hybrid_benchmark"
harness = false
required-features = ["rayon"]

[[test]]
name = "process_runtime"
path = "tests/integration/process_runtime.rs"

[[bench]]
name = "process_throughput"
harness = false
required-features = ["rayon"]
