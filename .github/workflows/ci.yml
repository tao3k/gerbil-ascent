name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scheme:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-release/v19
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates git jq just libssl-dev openssl pkg-config zlib1g-dev
          just --version
      - name: Install immutable Gerbil v0.19 release
        run: bash tools/ci/install-gerbil-v19-release.sh "$GERBIL_RELEASE_ROOT"
      - name: Install declared Gerbil dependencies
        run: |
          mkdir -p "$HOME/.gerbil/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          gerbil deps --install
          gerbil env gerbil interactive -e '(begin (import :asp-gerbil-scheme/building-api :asp-gerbil-scheme/benchmark-api) (displayln "ascent-dependencies-ready"))'
      - name: Build Scheme package
        run: ASP_GERBIL_SCHEME_POLICY=1 gerbil build
      - name: Qualify Scheme rules
        run: just test
      - name: Build native DSL closure entry
        run: just build-dsl-closure
      - name: Qualify native DSL closure
        run: just check-dsl-closure
      - name: Qualify ASCENT SS scenarios
        run: just performance
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [byods, other]
    env:
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-release/v19
      ORACLE_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates git jq just libssl-dev openssl pkg-config zlib1g-dev
          just --version
      - name: Install immutable Gerbil v0.19 release
        run: bash tools/ci/install-gerbil-v19-release.sh "$GERBIL_RELEASE_ROOT"
      - name: Install declared Gerbil dependencies
        run: |
          mkdir -p "$HOME/.gerbil/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          gerbil deps --install
          gerbil env gerbil interactive -e '(begin (import :asp-gerbil-scheme/building-api :asp-gerbil-scheme/benchmark-api) (displayln "ascent-dependencies-ready"))'
      - name: Build Scheme package
        run: gerbil build
      - name: Enforce Rust warnings and ASP policy
        if: matrix.shard == 'other'
        run: |
          cargo clippy --locked --manifest-path rust/ascent-oracle/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path rust/ascent-oracle/Cargo.toml --test asp_rust_gate
      - name: Build native retained and arity differential entry
        if: matrix.shard == 'other'
        run: just build-dsl-closure
      - name: Compare with Rust Ascent
        run: |
          case "$ORACLE_SHARD" in
            byods)
              gerbil env env PATH="$PATH" cargo test --locked --manifest-path rust/ascent-oracle/Cargo.toml --test scheme_parity -- byods::
              ;;
            other)
              gerbil env env PATH="$PATH" cargo test --locked --manifest-path rust/ascent-oracle/Cargo.toml --test scheme_parity -- --skip byods::
              ;;
            *) exit 2 ;;
          esac
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install fixed Lean toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y elan
          elan toolchain install leanprover/lean4:v4.34.1
      - name: Check abstract closure and finite-height proofs
        run: |
          elan run leanprover/lean4:v4.34.1 lean packages/proofs/lean/PositiveNonmembership.lean
          elan run leanprover/lean4:v4.34.1 lean packages/proofs/lean/FiniteHeight.lean
          elan run leanprover/lean4:v4.34.1 lean packages/proofs/lean/FiniteOperators.lean
      - name: Reject invalid artifact publication and model byte contexts
        run: python3 -m unittest tools/test_dsl_artifact.py tools/test_model_closure_study.py -v
  native-and-oracle:
    if: ${{ always() }}
    needs: [scheme, oracle, formal]
    runs-on: ubuntu-latest
    steps:
      - name: Require all independent qualification jobs
        env:
          SCHEME_RESULT: ${{ needs.scheme.result }}
          ORACLE_RESULT: ${{ needs.oracle.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
        run: |
          test "$SCHEME_RESULT" = success
          test "$ORACLE_RESULT" = success
          test "$FORMAL_RESULT" = success
