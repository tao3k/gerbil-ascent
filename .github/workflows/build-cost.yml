name: macOS semantics and build experiments
on:
  pull_request:
    paths:
      - '**/*.ss'
      - gerbil.pkg
      - dev/**
      - bindings/c/**
      - justfile
      - workbench/src/ascent_workbench/supervision.py
      - workbench/tests/test_supervision.py
      - tools/ci/build-cost-control.py
      - workbench/src/ascent_workbench/preparation_*.py
      - packages/proofs/lean/ExecutionPolicy.lean
      - packages/proofs/lean/Preparation*.lean
      - packages/proofs/quint/Preparation*.qnt
      - .github/workflows/build-cost.yml
  workflow_dispatch:
    inputs:
      process_throughput:
        description: Measure resident production VM processes and Rayon on the same fixed work
        type: boolean
        default: false
      work_distribution:
        description: Rust-owned request fanout for the on-demand production matrix
        type: choice
        default: adaptive
        options: [adaptive, across-requests, within-request]
      baseline:
        description: Baseline for on-demand ABBA; omit to run full macOS semantics
        required: false
      candidate:
        description: Optional candidate commit for a historical work diagnosis
        default: ""
        required: false
      work_only:
        description: Instrument work instead of qualifying wall time
        type: boolean
        default: false
      semantic_preparation:
        description: Measure source-Suite preparation with the same ABBA controls
        type: boolean
        default: false
      semantic_runtime:
        description: Also compare all source semantics with twelve single-thread VMs and the current 600-second limit
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build-cost:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.baseline != '' || inputs.process_throughput) }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install released SDK prerequisites
        run: |
          brew update
          brew install gcc just openssl@3 zlib sqlite coreutils pkg-config
          command -v gcc-16
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install unchanged immutable SDK
        env:
          GERBIL_RELEASE_ARCHIVE_CACHE: ${{ runner.temp }}/archives
        run: bash tools/ci/install-gerbil-v19-release.sh "$RUNNER_TEMP/sdk"
      - name: Prepare one declared dependency seed
        run: |
          echo "GERBIL_BUILD_CORES=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"
          export GERBIL_BUILD_CORES="$(sysctl -n hw.logicalcpu)"
          mkdir -p "$HOME/.gerbil/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          gerbil deps --install
          test ! -e .gerbil/lib/gerbil-ascent
          test ! -e .gerbil/lib/asp-gerbil-scheme
      - name: Prepare source-comparison development tools
        if: ${{ inputs.baseline != '' }}
        run: (cd dev && GERBIL_PATH="$GITHUB_WORKSPACE/.gerbil" gerbil deps --install)
      - name: On-demand ABBA cold build and test preparation
        if: ${{ inputs.baseline != '' }}
        env:
          BASELINE: ${{ inputs.baseline }}
          CANDIDATE: ${{ inputs.candidate || github.event.pull_request.head.sha || github.sha }}
          WORK_ONLY: ${{ inputs.work_only || false }}
          SEMANTIC_PREPARATION: ${{ inputs.semantic_preparation || false }}
          SEMANTIC_RUNTIME: ${{ inputs.semantic_runtime || false }}
          GERBIL_BUILD_CORES: "3"
        run: |
          work_args=()
          if [[ "$WORK_ONLY" == "true" ]]; then work_args+=(--work-only); fi
          if [[ "$SEMANTIC_PREPARATION" == "true" ]]; then work_args+=(--semantic-preparation); fi
          if [[ "$SEMANTIC_RUNTIME" == "true" ]]; then work_args+=(--semantic-runtime); fi
          python3 tools/ci/build-cost-control.py --baseline "$BASELINE" --candidate "$CANDIDATE" --output "$RUNNER_TEMP/build-cost" "${work_args[@]}"
      - name: Build production process benchmark with the released SDK
        if: ${{ inputs.process_throughput }}
        env:
          CARGO_BUILD_JOBS: "3"
          GERBIL_BUILD_CORES: "3"
          GERBIL_PATH: ${{ github.workspace }}/.gerbil
          MACOSX_DEPLOYMENT_TARGET: "26.0"
          RUSTFLAGS: "-C link-arg=-Wl,-ld_classic"
        run: |
          xcrun --find ld-classic
          printf 'RUSTFLAGS=%s\nMACOSX_DEPLOYMENT_TARGET=%s\n' "$RUSTFLAGS" "$MACOSX_DEPLOYMENT_TARGET" > "$RUNNER_TEMP/process-build-recipe.txt"
          cargo build --release --locked --manifest-path rust/Cargo.toml -p ascent-scheme --bin ascent-scheme-worker --message-format=json > "$RUNNER_TEMP/process-worker-build.jsonl"
          cargo bench --no-run --profile release --locked --manifest-path rust/Cargo.toml -p ascent-scheme --bench process_throughput --message-format=json > "$RUNNER_TEMP/process-benchmark-build.jsonl"
      - name: Qualify complete macOS process semantics before measurement
        if: ${{ inputs.process_throughput }}
        env:
          CARGO_BUILD_JOBS: "3"
          GERBIL_BUILD_CORES: "3"
          GERBIL_PATH: ${{ github.workspace }}/.gerbil
          MACOSX_DEPLOYMENT_TARGET: "26.0"
          RUSTFLAGS: "-C link-arg=-Wl,-ld_classic"
        run: |
          set -o pipefail
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.140/cargo-nextest-0.9.140-universal-apple-darwin.tar.gz
          printf '58e0a722f9444078fab447783f322acf15a2a771ba785b3fbbe8bacda31c3df9  %s\n' "$archive" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/nextest"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nextest"
          export PATH="$RUNNER_TEMP/nextest:$PATH"
          cargo nextest run --release --no-fail-fast --locked --manifest-path rust/Cargo.toml -p ascent-scheme --test-threads 12 --retries 0 --success-output immediate 2>&1 | tee "$RUNNER_TEMP/process-binding-tests.log"
          ! grep -E 'ASCENT-(PROCESS-(FORCED-STOP|SHUTDOWN-ERROR)|CHECKPOINT-TRANSPORT-ERROR)|^[[:space:]]*(FAIL \+ )?LEAK[[:space:]]' "$RUNNER_TEMP/process-binding-tests.log"
      - name: Measure sustained production interface after all compilation
        if: ${{ inputs.process_throughput }}
        env:
          ASCENT_WORK_DISTRIBUTION: ${{ inputs.work_distribution || 'adaptive' }}
        run: |
          benchmark="$(python3 -c 'import json,sys; print(next(v["executable"] for line in open(sys.argv[1]) if (v:=json.loads(line)).get("reason")=="compiler-artifact" and v.get("target",{}).get("name")=="process_throughput" and v.get("executable")))' "$RUNNER_TEMP/process-benchmark-build.jsonl")"
          python3 tools/ci/process-throughput.py --benchmark "$benchmark" --worker rust/target/release/ascent-scheme-worker --expected-cpus 3 --output "$RUNNER_TEMP/process-throughput"
      - name: Preserve production throughput and every negative observation
        if: ${{ always() && inputs.process_throughput }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: process-throughput-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/process-throughput
            ${{ runner.temp }}/process-benchmark-build.jsonl
            ${{ runner.temp }}/process-worker-build.jsonl
            ${{ runner.temp }}/process-build-recipe.txt
            ${{ runner.temp }}/process-binding-tests.log
            ~/Library/Logs/DiagnosticReports/ld-*.ips
          include-hidden-files: true
      - name: Preserve every control and admission record
        if: ${{ always() && inputs.baseline != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-build-cost-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-cost
          include-hidden-files: true

  macos-preparation:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.baseline == '' && !inputs.process_throughput) }}
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      prepared: ${{ steps.semantic-preparation.outcome == 'success' && steps.prepared-artifact.outcome == 'success' }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      GERBIL_BUILD_CORES: "3"
      # Completion allowance, separate from unchanged timed performance gates.
      ASCENT_GXTEST_TIMEOUT: "600s"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install released SDK prerequisites
        run: |
          brew update
          brew install gcc just openssl@3 zlib sqlite coreutils pkg-config
          command -v gcc-16
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install unchanged immutable SDK
        env:
          GERBIL_RELEASE_ARCHIVE_CACHE: ${{ runner.temp }}/archives
        run: bash tools/ci/install-gerbil-v19-release.sh "$RUNNER_TEMP/sdk"
      - name: Bind compiler inputs before restoring compiled preparation
        id: preparation
        run: |
          fingerprint="$(sha256sum "$GERBIL_HOME/bin/gxi" "$GERBIL_HOME/bin/gsc" "$GERBIL_HOME/include/gambit.h" "$(command -v gcc-16)" "$(gcc-16 -print-prog-name=cc1)" "$(xcrun --find ld)" "$GERBIL_PREFIX/gerbil-build-receipt.json" | sha256sum | cut -d ' ' -f 1)"
          printf 'toolchain=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
          git diff --exit-code HEAD -- '*.ss' bindings/c gerbil.pkg justfile ':(exclude)manifest.ss'
          # BEGIN GENERATED PREPARATION CACHE-INPUTS
          compiler_inputs="$(git ls-files -s -- build.ss build-modules.ss gerbil.pkg dev/gerbil.pkg bindings t/harness/build.ss t/harness/artifact-admission.ss t/harness/library-spec.ss | sha256sum | cut -d ' ' -f 1)"
          printf 'compiler_inputs=%s\n' "$compiler_inputs" >> "$GITHUB_OUTPUT"
          source_inputs="$(git ls-files -s -- '*.ss' bindings/c gerbil.pkg dev/gerbil.pkg justfile .github/workflows/build-cost.yml ':(exclude)manifest.ss' | sha256sum | cut -d ' ' -f 1)"
          printf 'source_inputs=%s\n' "$source_inputs" >> "$GITHUB_OUTPUT"
          echo 'source_bytes=${{ hashFiles('**/*.ss', 'bindings/c/**', '!manifest.ss', '!.gerbil/**', '!.ci/**', '!.cache/**', 'justfile', 'gerbil.pkg', 'dev/gerbil.pkg', '.github/workflows/build-cost.yml') }}' >> "$GITHUB_OUTPUT"
          # END GENERATED PREPARATION CACHE-INPUTS
          {
            echo 'cache_sources<<ASCENT_CACHE_SOURCE_PATHS'
            git ls-files -- '*.ss' bindings/c ':(exclude)manifest.ss'
            echo 'ASCENT_CACHE_SOURCE_PATHS'
          } >> "$GITHUB_OUTPUT"
      - name: Restore content-bound compiled preparation
        id: preparation-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.preparation.outputs.cache_sources }}
            .gerbil
            .cache/ascent/compiled-library
          key: macos-preparation-v2-${{ runner.os }}-${{ runner.arch }}-3-${{ steps.preparation.outputs.toolchain }}-${{ steps.preparation.outputs.compiler_inputs }}-${{ steps.preparation.outputs.source_inputs }}-${{ steps.preparation.outputs.source_bytes }}
          restore-keys: |
            macos-preparation-v2-${{ runner.os }}-${{ runner.arch }}-3-${{ steps.preparation.outputs.toolchain }}-${{ steps.preparation.outputs.compiler_inputs }}-
      - name: Restore current program inputs before using cached compilation
        run: |
          # This checkout is disposable and was checked clean before restore.
          # Git retains unchanged cached source clocks; make owns invalidation.
          # BEGIN GENERATED PREPARATION RESTORE-INPUTS
          git diff --name-only HEAD -- '*.ss' bindings/c
          git reset --hard HEAD
          git clean -f -- '*.ss' bindings/c
          # END GENERATED PREPARATION RESTORE-INPUTS
      - name: Admit restored compiler inputs
        env:
          EXPECTED_SOURCE_BYTES: ${{ steps.preparation.outputs.source_bytes }}
          RESTORED_SOURCE_BYTES: ${{ hashFiles('**/*.ss', 'bindings/c/**', '!manifest.ss', '!.gerbil/**', '!.ci/**', '!.cache/**', 'justfile', 'gerbil.pkg', 'dev/gerbil.pkg', '.github/workflows/build-cost.yml') }}
        run: |
          # BEGIN GENERATED PREPARATION CACHE-ADMISSION
          test "$EXPECTED_SOURCE_BYTES" = "$RESTORED_SOURCE_BYTES"
          git diff --exit-code HEAD -- '*.ss' bindings/c gerbil.pkg justfile ':(exclude)manifest.ss'
          # END GENERATED PREPARATION CACHE-ADMISSION
      - name: Restore declared dependency build
        if: ${{ steps.preparation-cache.outputs.cache-matched-key == '' }}
        id: dependencies-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .gerbil
            !.gerbil/lib/gerbil-ascent
            !.gerbil/lib/static/gerbil-ascent__*
            !.gerbil/bin/libascent*
            !.gerbil/bin/ascent-develop*
          key: gerbil-dependencies-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.preparation.outputs.toolchain }}-${{ hashFiles('gerbil.pkg', 'dev/gerbil.pkg', 'tools/ci/install-gerbil-v19-release.sh') }}
      - name: Install declared Scheme dependencies
        # A compatible, admitted prefix already contains these exact declarations.
        # Reinstalling rebuilds Core and invalidates unchanged support interfaces.
        if: ${{ steps.preparation-cache.outputs.cache-matched-key == '' && steps.dependencies-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$HOME/.gerbil/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          gerbil deps --install
          (cd dev && GERBIL_PATH="$GITHUB_WORKSPACE/.gerbil" gerbil deps --install)
      - name: Verify declared Gerbil interfaces
        run: gerbil env gerbil interactive -e '(begin (import :asp-gerbil-scheme/building-api :asp-gerbil-scheme/benchmark-api) (displayln "ascent-dependencies-ready"))'
      - name: Build current Scheme package
        run: gerbil build
      - name: Check development policy
        run: just check-policy
      - name: Verify supported SDK compiler profile and allocation counters
        run: |
          PYTHONPATH=workbench/src python3 -m unittest discover -s workbench/tests -p test_compiler_cost.py -v
          PYTHONPATH=workbench/src python3 -m unittest discover -s workbench/tests -p test_reference_cache.py -v
          PYTHONPATH=workbench/src python3 -m unittest discover -s workbench/tests -p test_study_profile.py -v
          PYTHONPATH=workbench/src python3 -m unittest discover -s workbench/tests -p test_source_semantic_ci.py -v
      - name: Prepare complete source semantic dependencies
        id: semantic-preparation
        run: |
          mkdir -p "$RUNNER_TEMP/macos-semantics"
          set -o pipefail
          { time -p just prepare-semantic-library; } 2>&1 | tee "$RUNNER_TEMP/macos-semantics/prepare.log"
      - name: Verify warm semantic cache reuse
        id: semantic-cache
        if: ${{ !cancelled() && steps.semantic-preparation.outcome == 'success' }}
        run: python3 tools/ci/build-cost-control.py --semantics-only --semantic-phase cache --output "$RUNNER_TEMP/macos-semantics/cache"
      - name: Save admitted compilation before semantic execution
        if: ${{ !cancelled() && steps.semantic-cache.outcome == 'success' && steps.preparation-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.preparation.outputs.cache_sources }}
            .gerbil
            .cache/ascent/compiled-library
          key: ${{ steps.preparation-cache.outputs.cache-primary-key }}
      - name: Package current compilation without changing source clocks
        if: ${{ !cancelled() && steps.semantic-preparation.outcome == 'success' }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/macos-semantics/head"
          printf '%s\n' '${{ steps.preparation.outputs.toolchain }}' > "$RUNNER_TEMP/macos-semantics/toolchain"
          git ls-files -z -- '*.ss' bindings/c ':(exclude)manifest.ss' > "$RUNNER_TEMP/prepared-inputs"
          tar -cf "$RUNNER_TEMP/macos-semantics/prepared.tar" --null -T "$RUNNER_TEMP/prepared-inputs" .gerbil .cache/ascent/compiled-library
      - name: Transfer this run's prepared compilation
        id: prepared-artifact
        if: ${{ !cancelled() && steps.semantic-preparation.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-prepared-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-semantics/prepared.tar
            ${{ runner.temp }}/macos-semantics/head
            ${{ runner.temp }}/macos-semantics/toolchain
          compression-level: 1
          retention-days: 1
      - name: Preserve semantic diagnostics and every batch log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-preparation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-semantics/*.log
            ${{ runner.temp }}/macos-semantics/cache
            .cache/ascent/test-modules
          include-hidden-files: true

  macos-semantics:
    needs: macos-preparation
    # Cache diagnostics must not suppress a successfully prepared semantic run.
    if: ${{ always() && !cancelled() && needs.macos-preparation.outputs.prepared == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      GERBIL_BUILD_CORES: "3"
      ASCENT_GXTEST_TIMEOUT: "600s"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install released SDK prerequisites
        run: |
          brew update
          brew install gcc just openssl@3 zlib sqlite coreutils pkg-config
          command -v gcc-16
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install unchanged immutable SDK
        env:
          GERBIL_RELEASE_ARCHIVE_CACHE: ${{ runner.temp }}/archives
        run: bash tools/ci/install-gerbil-v19-release.sh "$RUNNER_TEMP/sdk"
      - name: Download this run's prepared compilation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-prepared-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-semantics
      - name: Verify source and SDK identity before loading compilation
        run: |
          test "$(cat "$RUNNER_TEMP/macos-semantics/head")" = "$(git rev-parse HEAD)"
          fingerprint="$(sha256sum "$GERBIL_HOME/bin/gxi" "$GERBIL_HOME/bin/gsc" "$GERBIL_HOME/include/gambit.h" "$(command -v gcc-16)" "$(gcc-16 -print-prog-name=cc1)" "$(xcrun --find ld)" "$GERBIL_PREFIX/gerbil-build-receipt.json" | sha256sum | cut -d ' ' -f 1)"
          test "$(cat "$RUNNER_TEMP/macos-semantics/toolchain")" = "$fingerprint"
          tar -xf "$RUNNER_TEMP/macos-semantics/prepared.tar"
          git diff --exit-code HEAD -- '*.ss' bindings/c gerbil.pkg justfile ':(exclude)manifest.ss'
      - name: Qualify complete source semantics with twelve single-thread VMs
        # A cache-check failure must not suppress full semantic verification.
        if: ${{ !cancelled() && success() }}
        env:
          GERBIL_BUILD_CORES: "12"
          GERBIL_LOADPATH: ${{ github.workspace }}/.gerbil/lib
        run: |
          set -o pipefail
          { time -p timeout "$ASCENT_GXTEST_TIMEOUT" just test-file t/qualification 2G; } 2>&1 | tee "$RUNNER_TEMP/macos-semantics/semantics.log"
          python3 tools/ci/build-cost-control.py --verify-source-log "$RUNNER_TEMP/macos-semantics/semantics.log" --output "$RUNNER_TEMP/macos-semantics/verified"
      - name: Preserve semantic diagnostics and every batch log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-semantics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-semantics/*.log
            ${{ runner.temp }}/macos-semantics/verified
            .cache/ascent/test-modules
          include-hidden-files: true
