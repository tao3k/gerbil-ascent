name: Existing Release build control
on:
  push:
    branches: [test/release-build-control]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install release runtime and compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates jq libssl-dev libsqlite3-dev zlib1g-dev
      - name: Install unchanged pinned Release
        run: bash tools/ci/install-gerbil-v19-release.sh "$RUNNER_TEMP/sdk"
      - name: Standard BuildSpec, fresh 1-core and 4-core controls
        run: python3 tools/ci/standard_build_probe.py --output "$RUNNER_TEMP/release-build-control"
      - name: Preserve source, compiler outputs and exact receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-build-control
          path: ${{ runner.temp }}/release-build-control
          include-hidden-files: true
