[package]
name = "ascent-python"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ascent"
crate-type = ["cdylib"]

[dependencies]
gerbil-ascent = { workspace = true, features = ["provider-protocol", "artifacts"] }
ascent-c-abi = { path = "../ascent-c-abi", optional = true }
pyo3.workspace = true
serde_json.workspace = true
ascent-scheme = { path = "../ascent-scheme", optional = true }
gerbil-scheme-python = { workspace = true, features = ["python", "c-abi", "parallel-verification"], optional = true }

[build-dependencies]
# The upstream PR retired the IR generator. Freeze the exact build-only
# generator inputs still used by ascent; this crate is never a runtime owner.
gerbil-scheme-compiler-source = { package = "gerbil-scheme-python", git = "https://github.com/tao3k/gerbil-scheme-rust", rev = "7ebc26dac9e32f982f9ab1455b664b01f2f6e007", default-features = false }
gerbil-scheme-python.workspace = true
serde_json.workspace = true

[dev-dependencies]
asp-rust.workspace = true

[features]
default = ["rayon", "rust-runtime"]
scheme-runtime = ["dep:ascent-scheme"]
rust-runtime = ["dep:gerbil-scheme-python", "dep:ascent-c-abi"]
rayon = ["gerbil-ascent/rayon"]
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true
