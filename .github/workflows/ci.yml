name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scheme:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-release/v19
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates git jq just libssl-dev openssl pkg-config zlib1g-dev
          just --version
      - name: Install immutable Gerbil v0.19 release
        run: bash tools/ci/install-gerbil-v19-release.sh "$GERBIL_RELEASE_ROOT"
      - name: Install declared Gerbil dependencies
        run: |
          mkdir -p "$HOME/.gerbil/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          gerbil deps --install
          gerbil env gerbil interactive -e '(begin (import :asp-gerbil-scheme/building-api :asp-gerbil-scheme/benchmark-api) (displayln "ascent-dependencies-ready"))'
      - name: Build Scheme package
        run: ASP_GERBIL_SCHEME_POLICY=1 gerbil build
      - name: Qualify Scheme rules
        run: just test
      - name: Qualify runtime source view loading
        run: just check-source-views
      - name: Qualify native actor pool lifecycle
        run: just check-actor-pool
      - name: Qualify native single-module entry and failure controls
        run: just check-native-entry
      - name: Build native DSL closure entry
        run: just build-dsl-closure
      - name: Qualify native DSL closure
        run: just check-dsl-closure
      - name: Measure native retained replacement against fresh evaluation
        run: just check-retained-benefit
      - name: Qualify actual native compiler source closure
        run: PYTHONPATH=python/src gerbil env python3 -m ascent_test_support.model_study probe .cache/ascent/model-source-probe
      - name: Qualify ASCENT SS scenarios
        run: just performance
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [byods, other, byods-scale]
    env:
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-release/v19
      ORACLE_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates git jq just libssl-dev openssl pkg-config zlib1g-dev
          just --version
      - name: Install immutable Gerbil v0.19 release
        run: bash tools/ci/install-gerbil-v19-release.sh "$GERBIL_RELEASE_ROOT"
      - name: Install declared Gerbil dependencies
        run: |
          mkdir -p "$HOME/.gerbil/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          gerbil deps --install
          gerbil env gerbil interactive -e '(begin (import :asp-gerbil-scheme/building-api :asp-gerbil-scheme/benchmark-api) (displayln "ascent-dependencies-ready"))'
      - name: Build Scheme package
        run: gerbil build
      - name: Qualify runtime source view loading
        run: just check-source-views
      - name: Enforce Rust warnings and ASP policy
        if: matrix.shard == 'other'
        run: |
          cargo clippy --locked --manifest-path rust/ascent-oracle/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path rust/ascent-oracle/Cargo.toml --test asp_rust_gate
      - name: Build native retained, arity and BYODS differential entry
        run: just build-dsl-closure
      - name: Compare with Rust Ascent
        run: |
          case "$ORACLE_SHARD" in
            byods)
              gerbil env env PATH="$PATH" python3 python/src/ascent_test_support/blocking_stdio.py -- cargo test --locked --manifest-path rust/ascent-oracle/Cargo.toml --test scheme_parity -- byods:: --nocapture --test-threads=1
              ;;
            other)
              gerbil env env PATH="$PATH" python3 python/src/ascent_test_support/blocking_stdio.py -- cargo test --locked --manifest-path rust/ascent-oracle/Cargo.toml --test scheme_parity -- --skip byods:: --nocapture
              ;;
            byods-scale)
              # Compile first; the runtime deadline applies to the actual scale test.
              gerbil env env PATH="$PATH" python3 python/src/ascent_test_support/blocking_stdio.py -- cargo test --release --locked --manifest-path rust/ascent-oracle/Cargo.toml --test scheme_parity --no-run --message-format=json > "$RUNNER_TEMP/ascent-scale-build.jsonl"
              executable="$(jq -Rr 'fromjson? | select(.reason == "compiler-artifact" and .target.name == "scheme_parity" and .executable != null) | .executable' "$RUNNER_TEMP/ascent-scale-build.jsonl")"
              test -x "$executable"
              gerbil env env PATH="$PATH" python3 python/src/ascent_test_support/blocking_stdio.py -- timeout 180s "$executable" --exact byods::trrel_uf_full_rust_scale_oracle --ignored --test-threads=1 --nocapture
              ;;
            *) exit 2 ;;
          esac
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Reject committed execution logs
        run: |
          if [ -n "$(git ls-files '*.log' '*.log.license')" ]; then
            echo 'Execution logs and log license sidecars must not be committed.' >&2
            exit 1
          fi
      - name: Install fixed Lean toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y elan just
          elan toolchain install leanprover/lean4:v4.34.0
      - name: Check Lean contracts, TLA publication and counterexamples
        env:
          ASCENT_TLC_GENERATION_CUTOFF: '4'
        run: just check-formal
      - name: Qualify Python byte IO and process supervision
        run: python3 -m unittest discover -s python/tests -v
  native-and-oracle:
    if: ${{ always() }}
    needs: [scheme, oracle, formal]
    runs-on: ubuntu-latest
    steps:
      - name: Require all independent qualification jobs
        env:
          SCHEME_RESULT: ${{ needs.scheme.result }}
          ORACLE_RESULT: ${{ needs.oracle.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
        run: |
          test "$SCHEME_RESULT" = success
          test "$ORACLE_RESULT" = success
          test "$FORMAL_RESULT" = success
