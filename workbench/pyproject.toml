[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascent-workbench"
version = "1"
description = "Independent ASCENT consumer for qualification and research"
requires-python = ">=3.10"
dependencies = ["gerbil-ascent>=0.1,<0.2"]

[project.scripts]
ascent-workbench = "ascent_workbench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ascent_workbench*"]

[tool.uv.sources]
gerbil-ascent = { path = "../python", editable = true }
